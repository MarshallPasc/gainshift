<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- speaker -->
  <path d="M26 57 a4 4 0 0 1 4 -4 h9 l17 -17 a3.5 3.5 0 0 1 6 2.5 v51 a3.5 3.5 0 0 1 -6 2.5 l-17 -17 h-9 a4 4 0 0 1 -4 -4 z"
        fill="#ffffff"/>

  <!-- sound waves: concentric arcs, rounded caps, curving back toward the speaker -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M71.4 51.4 A17 17 0 0 1 71.4 76.6"   opacity="1"/>
    <path d="M79.1 42.8 A28.5 28.5 0 0 1 79.1 85.2" opacity="0.72"/>
    <path d="M86.8 34.3 A40 40 0 0 1 86.8 93.7"     opacity="0.45"/>
  </g>
</svg>
